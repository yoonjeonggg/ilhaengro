<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>프로젝트명</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background: #0f172a; color: #e2e8f0; text-align: center; padding: 16px;
    }
    h1 { font-size: 2.2rem; margin: 0 0 12px; }
    p { color: #94a3b8; margin: 6px 0; }
    .badge {
      display: inline-block; margin-top: 20px; padding: 6px 14px;
      border-radius: 999px; background: #1e293b; font-size: .9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>프로젝트명</h1>
    <p>한 줄 소개: 어떤 문제를 어떻게 해결하는 서비스인지</p>
    <p>2026 청도 바이브코딩 해커톤 · 팀명</p>
    <span class="badge">🚧 개발 중입니다</span>
  </main>
</body>
</html>
